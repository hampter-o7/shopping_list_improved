name: shopping_list
description: A shopping list app.
publish_to: 'none'
version: 1.7.2+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter
  shared_preferences: ^2.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  file_picker: ^11.0.2
  flutter_settings_ui: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  accessibility_tools: ^2.7.1
  flutter_speed_dial: ^7.0.0
  implicitly_animated_reorderable_list_2: ^0.6.0
  provider: ^6.1.5+1
  flex_color_picker: ^3.8.0
  speech_to_text: ^7.4.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: assets\icon\icon.png
  adaptive_icon_foreground: assets\icon\smaller_icon.png
  adaptive_icon_background: "#FFBD33"

flutter:
  uses-material-design: true
  assets:
    - assets/language/